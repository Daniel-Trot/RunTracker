services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: runtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/runtracker
      SPRING_DATASOURCE_USERNAME: postgres
    depends_on:
      - postgres

volumes:
  postgres-data: